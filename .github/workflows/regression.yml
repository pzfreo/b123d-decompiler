name: Regression

# The thirteen public parts of the regression set, decompiled and compared part by part
# with baselines/regression-ci-summary.csv. A part that loses more than 0.005 IoU, stops
# scoring, or goes missing fails the run.
#
# Billet trials are normally budgeted in CPU seconds, so a runner's speed would decide
# how many billets it tries. `--trials 6` takes the clock away: it tries every billet
# offered (STOCK_TRIALS in stock.py is 6) and searches for them untimed. The kernel
# still gives slightly different answers on Linux and macOS, so the baseline is taken
# from this job's own output, not from a run on a developer's machine. quiddity's
# corpus is pinned to a commit, as the dataset is to a revision, so the inputs cannot
# change under the baseline either.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pzfreo/quiddity
          ref: e44aa94227421d2a60545c95a1b6de8e929c1b97
          path: quiddity-corpus
          sparse-checkout: tests/corpus
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Assemble the corpus
        run: uv run --with huggingface_hub python tools/regression_corpus.py quiddity-corpus corpus
      - name: Decompile and score
        run: uv run b123d-decompile batch corpus -o results --jobs 2 --trials 6 --part-timeout 3600
      - name: Compare with the baseline
        run: uv run python tools/compare_runs.py baselines/regression-ci-summary.csv results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-results
          path: |
            results/summary.csv
            results/*/report.json
            results/*/*.py
