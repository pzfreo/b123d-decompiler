[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b123d-decompiler"
version = "0.1.0.dev0"
description = "Decompile STEP files into build123d source via quiddity feature recognition, and measure the result"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Paul Fremantle", email = "pzfreo@gmail.com" }]
requires-python = ">=3.10,<3.15"
dependencies = [
    "build123d>=0.9,<0.12",
    "quiddity>=0.3.5",
    "shapely>=2.0",
]
keywords = ["build123d", "cad", "step", "decompiler", "feature-recognition", "quiddity"]

[project.urls]
Repository = "https://github.com/pzfreo/b123d-decompiler"

[project.scripts]
b123d-decompile = "b123d_decompiler.cli:main"
# The vendored cad-fingerprint tool keeps its original command.
cad-fingerprint = "b123d_decompiler.fingerprint.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/b123d_decompiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# Vendored from cad-fingerprint and kept close to upstream so it can be re-synced.
# Our own style is not worth a diff against the source of truth.
extend-exclude = ["src/b123d_decompiler/fingerprint", "tests/fingerprint"]

[tool.ruff.lint]
# A geometry kernel raises for many unremarkable reasons: a face that will not
# extrude, an axis that will not build. Skipping the candidate is the handling.
ignore = ["S112"]
